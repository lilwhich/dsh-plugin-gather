# my_better-dsh bundle patch
#
# This file is the `dsh.bundle.patch` layer of the aggregation package. When
# installed through the official CLI:
#
#   dsh plugin --profile web add <my_better-dsh-spec>
#
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `my_better-dsh` to the bundle stack. The
# profile boot then merges THIS patch, which mounts every bundled plugin by
# inserting its row.
#
# Included plugins:
#   - dsh-at-file            (id: dsh-at-file,       name: dsh-at-file)
#   - dsh-better-sidebar     (id: better-sidebar,    name: 'dsh-better-sidebar')
#   - 右侧面板               (id: ui-dsh-aionui-panel, name: '@linxin666/dsh-client-ui-aionui-panel')
#   - 任务看板               (id: ui-task-board,      name: '@linxin666/dsh-client-ui-task-board')
#   - 实时吞吐               (id: live-stats,         name: '@linxin666/dsh-live-stats')
#   - 全家桶设置页           (id: ui-web-ui-settings, name: '@linxin666/dsh-client-ui-web-ui-settings')
#   - 皮肤中心               (id: ui-skin-center,     name: '@linxin666/dsh-client-ui-skin-center')
#
# NOTE: unlike @linxin666/dsh-web-ui-all (which pulls the whole family), this
# bundle depends on the individual packages above only — pet / remote-web-ui /
# git-graph / liangshen / describe-image / ssh are intentionally NOT included.
- insert:
    - id: dsh-at-file
      name: dsh-at-file
    - id: better-sidebar
      name: 'dsh-better-sidebar'

# my_better-dsh 自身的行（host 状态代理 + client 状态栏/上下文剩余指示）
- insert:
    - id: my-better-dsh
      name: my_better-dsh

# ── dsh-web-ui 精选（右侧面板 / 任务看板 / 实时吞吐 / 设置页 / 皮肤中心）──
- insert:
    - id: ui-dsh-aionui-panel
      name: '@linxin666/dsh-client-ui-aionui-panel'
- insert:
    - id: ui-task-board
      name: '@linxin666/dsh-client-ui-task-board'
- insert:
    - id: live-stats
      name: '@linxin666/dsh-live-stats'
- insert:
    - id: ui-web-ui-settings
      name: '@linxin666/dsh-client-ui-web-ui-settings'
- insert:
    - id: ui-skin-center
      name: '@linxin666/dsh-client-ui-skin-center'
